<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="A. Burak Tektas: robotics, autonomous-vehicle simulation and local LLM inference">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#f6f8fa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <rect x="640" y="2" width="556" height="276" rx="14" fill="url(#grid)"/>
  <rect x="640" y="2" width="220" height="276" fill="url(#fade)"/>

  <!-- flight path -->
  <path d="M740 214 L842 120 L960 184 L1062 84 L1130 160" fill="none" stroke="#0969da" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f6f8fa" stroke="#0969da" stroke-width="3">
    <circle cx="842" cy="120" r="8"/>
    <circle cx="960" cy="184" r="8"/>
    <circle cx="1062" cy="84" r="8"/>
  </g>
  <circle cx="1130" cy="160" r="10" fill="#0969da"/>
  <circle cx="1130" cy="160" r="20" fill="none" stroke="#0969da" stroke-width="2" opacity="0.35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e">
    <text x="856" y="112">WP1</text>
    <text x="974" y="206">WP2</text>
    <text x="1076" y="76">WP3</text>
  </g>
  <g transform="translate(740 214)">
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#0969da"/>
    <text y="5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">H</text>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-size="15" font-weight="600" letter-spacing="3" fill="#0969da">OSLO, NORWAY</text>
    <text x="62" y="152" font-size="54" font-weight="700" fill="#1f2328">A. Burak Tektas</text>
    <text x="64" y="196" font-size="21" fill="#59636e">Robotics · Autonomous-vehicle simulation · Local LLM inference</text>
  </g>
</svg>
